<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muzaytama: O Último Guerreiro</title>
<style>
:root{--bg:#06080d;--fg:#e9e6dc;--ac:#d4372c;--gold:#e8b84a;--card:#10141d;--bd:#2a3142;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#wrap{position:relative;max-width:1000px;margin:0 auto}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#000}
#ov{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;overscroll-behavior:contain;touch-action:pan-y;background:rgba(3,5,9,.86);overflow:auto;padding:10px}
.box{max-width:900px;width:100%;text-align:center;margin:auto}
h1{margin:0 0 6px;font-size:clamp(20px,4vw,30px);letter-spacing:2px;color:var(--fg)}
.title{font-size:clamp(34px,9vw,84px);letter-spacing:.08em;margin:0;font-weight:900;text-transform:uppercase;background:linear-gradient(180deg,#ffe9a8 0%,#e8b84a 42%,#b3261e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(212,55,44,.6)) drop-shadow(0 3px 0 #2a0a0a)}
.creators{margin:0 0 14px;font-size:clamp(11px,1.9vw,15px);letter-spacing:.14em;line-height:1.7;color:#cfc6b0;text-transform:uppercase}.creators b{color:#e8b84a;font-weight:700}
.sub{letter-spacing:.5em;text-indent:.5em;text-transform:uppercase;color:#e8b84a;font-size:clamp(11px,2.2vw,18px);margin:4px 0 12px}
h2{margin:4px 0;font-size:clamp(18px,3vw,26px)}
p{margin:6px 0;color:#b9b6ab;font-size:clamp(12px,1.8vw,15px)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:10px 0;text-align:left}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:13px}
.card b{display:block;margin-bottom:2px}
.card.eq{border-color:var(--ac)}
button{font:inherit;background:#1b2130;color:var(--fg);border:1px solid #3a4258;border-radius:6px;padding:6px 10px;margin:3px 3px 0 0;cursor:pointer;font-size:12px}
button:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
button:disabled{opacity:.4;cursor:default}
.big{background:var(--ac);border-color:var(--ac);font-size:16px;padding:10px 26px;margin-top:10px;color:#fff}
.gold{color:var(--gold)}
#tc{display:none;position:absolute;left:0;right:0;bottom:6px;justify-content:space-between;padding:0 8px;pointer-events:none}
#tc div{display:flex;gap:6px;pointer-events:auto}
#tc button{width:46px;height:46px;border-radius:50%;font-size:18px;padding:0;background:rgba(20,24,34,.7)}
@media(hover:none){#tc{display:flex}}
@media(prefers-color-scheme:light){:root{--bg:#06080d}}
</style></head><body>
<div id="wrap">
<canvas id="c" width="960" height="540"></canvas>
<div id="tc"><div><button data-k="KeyA">◀</button><button data-k="KeyD">▶</button></div>
<div><button data-k="ShiftLeft">⇥</button><button data-k="KeyQ">❄</button><button data-k="KeyE">💣</button><button data-k="KeyL">✦</button><button data-k="KeyK">✴</button><button data-k="KeyJ">⚔</button><button data-k="KeyW">⤒</button></div></div>
<div id="ov"></div>
</div>

function mount(c,w,base,amp,col,sd){c.fillStyle=col;c.beginPath();c.moveTo(0,H);for(let x=0;x<=w;x+=8){const y=base-amp*(.5+.5*M.sin(x*.011+sd)+.3*M.sin(x*.027+sd*3)+.15*M.sin(x*.07+sd));c.lineTo(x,y)}c.lineTo(w,H);c.fill()}

function pagoda(c,x,y,s,col){c.fillStyle=col;for(let i=0;i<4;i++){const w=(130-i*24)*s,yy=y-i*46*s;c.fillRect(x-w*.32,yy-34*s,w*.64,34*s);c.beginPath();c.moveTo(x-w*.75,yy-30*s);c.quadraticCurveTo(x-w*.35,yy-34*s,x,yy-58*s);c.quadraticCurveTo(x+w*.35,yy-34*s,x+w*.75,yy-30*s);c.quadraticCurveTo(x,yy-38*s,x-w*.75,yy-30*s);c.fill()}c.fillRect(x-2*s,y-230*s,4*s,40*s)}
function torii(c,x,y,s,col){c.fillStyle=col;c.fillRect(x-60*s,y-150*s,12*s,150*s);c.fillRect(x+48*s,y-150*s,12*s,150*s);c.beginPath();c.moveTo(x-84*s,y-142*s);c.quadraticCurveTo(x,y-168*s,x+84*s,y-142*s);c.lineTo(x+78*s,y-126*s);c.quadraticCurveTo(x,y-150*s,x-78*s,y-126*s);c.fill();c.fillRect(x-66*s,y-112*s,132*s,9*s)}
function toro(x,f){const y=G+4;ctx.fillStyle='#2a2d36';ctx.fillRect(x-5,y-46,10,46);ctx.fillRect(x-14,y-4,28,4);ctx.fillRect(x-16,y-62,32,16);ctx.beginPath();ctx.moveTo(x-24,y-62);ctx.lineTo(x,y-82);ctx.lineTo(x+24,y-62);ctx.fill();const g=ctx.createRadialGradient(x,y-54,3,x,y-54,150*f);g.addColorStop(0,'rgba(255,170,70,.45)');g.addColorStop(1,'rgba(255,120,30,0)');ctx.fillStyle=g;ctx.fillRect(x-160,y-210,320,260);ctx.fillStyle=`rgba(255,200,100,${.6+.4*f})`;ctx.fillRect(x-8,y-58,16,8)}

BG.sky=lay(W,H,c=>{let g=c.createLinearGradient(0,0,0,G);g.addColorStop(0,'#03050d');g.addColorStop(.55,'#12203a');g.addColorStop(1,'#3b4b66');c.fillStyle=g;c.fillRect(0,0,W,H);

function mk(k,boss){const d=ED[k],hf=1+(S.lvl-1)*.2+(boss?0:M.max(0,S.lvl-10)*.25),df=1+(S.lvl-1)*.08+(boss?0:M.max(0,S.lvl-10)*.05),sc=boss?1.7:1,hp=d.hp*hf*(boss?4.5*(1+S.lvl*.03):1);

function shieldBlock(){const p=S.p,sh=S.shield;if(!(sh&&sh.own&&sh.ch>0))return false;sh.ch--;sh.hit=.45;sfx(sh.ch>0?'block':'sbreak');p.inv=.5;S.shake=6;const x=p.x+p.face*34,y=p.y-60;spark(x,y,18,'#d9a2ff');spark(x,y,8,'#ffd23a');txt(p.x,p.y-110,sh.ch>0?'BLOQUEADO':'ESCUDO QUEBROU!','#d9a2ff');if(sh.ch<=0){sh.br=.9;spark(x,y,36,'#b070ff');spark(x,y,18,'#ffd23a');ring(x,G,70)}return true}
